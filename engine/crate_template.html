<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate</title>
<style>
  :root {
    --bg: #0d0c10; --panel: #17151c; --line: #2a2732; --text: #ece8f2; --dim: #8d879a;
    --colour: #ff4fa3; --motion: #3fd7ff; --strange: #c6ff3f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  .ctl { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  .ctl input[type=range] { width: 110px; }
  .ctl output { width: 30px; color: var(--text); font-variant-numeric: tabular-nums; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); padding: 4px 6px; border-radius: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .tag { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 999px;
         padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .tag.on { border-color: var(--text); color: var(--text); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 16px; }
  .tile { background: var(--panel); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .frame { position: relative; background: #000; }
  .frame img, .frame video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .frame video { position: absolute; inset: 0; }
  .rank { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.65); padding: 1px 6px;
          border-radius: 3px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .meta { padding: 8px 10px; display: grid; gap: 5px; }
  .row { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
  .bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .legend span { margin-right: 10px; }
  @media (max-width: 600px) { main { grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Crate</h1>
  <label class="ctl"><span style="color:var(--colour)">Colour</span><input id="w-colour" type="range" min="0" max="100"><output></output></label>
  <label class="ctl"><span style="color:var(--motion)">Motion</span><input id="w-motion" type="range" min="0" max="100"><output></output></label>
  <label class="ctl"><span style="color:var(--strange)">Strangeness</span><input id="w-strange" type="range" min="0" max="100"><output></output></label>
  <label class="ctl">Variety<input id="variety" type="range" min="0" max="100" value="50"><output></output></label>
  <label class="ctl">Clips shown<input id="count" type="range" min="12" max="300" value="96"><output></output></label>
  <label class="ctl">Per shot
    <select id="per-shot"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
  </label>
  <label class="ctl">Order
    <select id="order"><option value="score">Best first</option><option value="hue">By colour</option><option value="time">Film order</option></select>
  </label>
</header>
<div class="tags" id="tags"></div>
<main id="grid"></main>

<script src="clips.js"></script>
<script>
const L = window.LIBRARY;
const $ = (id) => document.getElementById(id);
const ar = L.crop.w * (L.source.sar || 1) / L.crop.h;
$("title").innerHTML = `${L.film}<small>${L.clips.length} candidate clips from ${L.shots.length} shots</small>`;

const W = { colour: L.weights.colour * 100, motion: L.weights.motion * 100, strange: L.weights.strange * 100 };
for (const k of Object.keys(W)) {
  const el = $("w-" + k);
  el.value = Math.round(W[k]);
  el.nextElementSibling.textContent = el.value;
  el.addEventListener("input", () => { W[k] = +el.value; el.nextElementSibling.textContent = el.value; render(); });
}
for (const id of ["count", "variety"]) {
  $(id).nextElementSibling.textContent = $(id).value;
  $(id).addEventListener("input", (e) => { e.target.nextElementSibling.textContent = e.target.value; render(); });
}
$("per-shot").addEventListener("change", render);
$("order").addEventListener("change", render);

const activeTags = new Set();
const tagCounts = {};
L.clips.forEach((c) => c.tags.forEach((t) => (tagCounts[t] = (tagCounts[t] || 0) + 1)));
Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]).forEach((t) => {
  const b = document.createElement("button");
  b.className = "tag"; b.textContent = `${t} ${tagCounts[t]}`;
  b.onclick = () => { activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); b.classList.toggle("on"); render(); };
  $("tags").appendChild(b);
});

function scoreOf(c) {
  const tot = W.colour + W.motion + W.strange || 1;
  return c.quality * (W.colour * c.colour + W.motion * c.motion + W.strange * c.strange) / tot;
}
const tc = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// One shared video element, moved into whichever tile is hovered and seeked to its clip.
const vid = document.createElement("video");
vid.src = L.proxy; vid.muted = true; vid.playsInline = true; vid.preload = "auto";
let playing = null;
vid.addEventListener("timeupdate", () => { if (playing && vid.currentTime >= playing.end) vid.currentTime = playing.start; });
function hoverIn(tile, c) {
  playing = c; tile.querySelector(".frame").appendChild(vid);
  const go = () => { if (playing === c) { vid.currentTime = c.start; vid.play().catch(() => {}); } };
  // Seeking before the video's metadata has loaded is ignored, so wait for it on first hover.
  if (vid.readyState >= 1) go(); else vid.addEventListener("loadedmetadata", go, { once: true });
}
function hoverOut() { playing = null; vid.pause(); vid.remove(); }

function render() {
  const perShot = +$("per-shot").value;
  let list = L.clips.filter((c) => !activeTags.size || c.tags.some((t) => activeTags.has(t)));
  list = list.map((c) => ({ c, s: scoreOf(c) })).sort((a, b) => b.s - a.s);
  const used = {};
  list = list.filter(({ c }) => (used[c.shot] = (used[c.shot] || 0) + 1) <= perShot);
  // Variety: one strong scene (a club full of strobes) can fill the whole crate on its own.
  // Each pick lowers the score of every clip within 45 seconds of it in the film. At 100, each
  // nearby pick costs 0.08, so a clip with five picks around it drops by 0.4 and the next scene
  // gets a turn.
  const variety = +$("variety").value / 100 * 0.08;
  const want = +$("count").value;
  const picked = [];
  const pool = list.slice();
  while (picked.length < want && pool.length) {
    let best = 0, bestS = -Infinity;
    for (let i = 0; i < pool.length; i++) {
      const c = pool[i].c;
      let near = 0;
      for (const p of picked) if (Math.abs(p.c.start - c.start) < 45) near++;
      const s = pool[i].s - variety * near;
      if (s > bestS) { bestS = s; best = i; }
      if (variety === 0) break;
    }
    picked.push(pool.splice(best, 1)[0]);
  }
  list = picked;
  list.forEach((x, i) => (x.rank = i + 1));
  const order = $("order").value;
  if (order === "hue") list.sort((a, b) => (a.c.hue_strength < 0.08) - (b.c.hue_strength < 0.08) || a.c.hue - b.c.hue);
  if (order === "time") list.sort((a, b) => a.c.start - b.c.start);

  const grid = $("grid");
  hoverOut();
  grid.innerHTML = "";
  for (const { c, s, rank } of list) {
    const t = document.createElement("div");
    t.className = "tile";
    const sw = c.hue_strength < 0.08 ? "#888" : `hsl(${c.hue} 85% 55%)`;
    t.innerHTML = `
      <div class="frame" style="aspect-ratio:${ar}"><img loading="lazy" src="thumbs/${c.id}.jpg" alt=""><span class="rank">#${rank} &middot; ${Math.round(s * 100)}</span></div>
      <div class="meta">
        <div class="bars">
          <div class="bar" title="colour"><i style="width:${c.colour * 100}%;background:var(--colour)"></i></div>
          <div class="bar" title="motion"><i style="width:${c.motion * 100}%;background:var(--motion)"></i></div>
          <div class="bar" title="strangeness"><i style="width:${c.strange * 100}%;background:var(--strange)"></i></div>
        </div>
        <div class="row"><span><span class="swatch" style="background:${sw}"></span>${tc(c.start)} to ${tc(c.end)}</span><span>${c.tags.join(", ")}</span></div>
      </div>`;
    t.addEventListener("mouseenter", () => hoverIn(t, c));
    t.addEventListener("mouseleave", hoverOut);
    grid.appendChild(t);
  }
}
render();
</script>
</body>
</html>
